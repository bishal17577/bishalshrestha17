<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghinga · Mahesh half · tag 2k views</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #0a0e16 0%, #1c2438 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 10px;
        }

        /* responsive container: comfortable phone to desktop */
        .game-card {
            width: 100%;
            max-width: 500px;  
            background: #1b2337;
            border-radius: 60px 60px 44px 44px;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.9), inset 0 0 0 2px #657bb0;
            padding: 24px 18px 32px;
            border: 3px solid #4b608b;
            transition: all 0.2s;
        }

        @media (min-width: 600px) {
            .game-card {
                max-width: 560px;
                padding: 28px 24px 40px;
                border-radius: 70px 70px 50px 50px;
            }
        }

        /* TikTok header */
        .viral-header {
            background: #28324b;
            border-radius: 100px;
            padding: 8px 18px 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #7f97c9;
            box-shadow: 0 8px 0 #151e30;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-badge {
            background: #1b253d;
            color: #ffdeaa;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 7px 16px;
            border-radius: 60px;
            border: 1px solid #dbb252;
            white-space: nowrap;
        }

        .views-panel {
            background: #212d48;
            border-radius: 60px;
            padding: 4px 18px 4px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #ffbc5c;
        }

        .fire {
            font-size: 1.8rem;
        }

        .view-counter {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(145deg, #ffe684, #ffa63e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
        }

        .view-label {
            color: #c0d4ff;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* main stage */
        .play-stage {
            background: #2f3d60;
            border-radius: 48px;
            padding: 20px 12px 28px;
            border: 3px solid #6780b9;
            box-shadow: inset 0 -4px 0 #23304b, 0 14px 0 #1b253b;
        }

        /* ----- BIG MAHESH PHOTO (half screen approx) ----- */
        .mahesh-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;  /* less margin, big photo takes space */
        }

        .mahesh-frame {
            background: #2e3b5e;
            border-radius: 70px 70px 40px 40px;
            padding: 22px 18px 16px;  /* adjusted padding */
            border: 6px solid #c6a35c;
            box-shadow: 0 18px 0 #2f3a58, inset 0 -6px 0 #5f77a6;
            transition: filter 0.2s, transform 0.15s;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* BIG photo: height ~ half of screen on phone, but we use vh relative */
        .mahesh-img {
            width: auto;           
            max-width: 100%;
            height: 38vh;          /* takes about half the view height on phone, scales on desktop */
            min-height: 240px;     /* ensures it's big enough */
            max-height: 350px;     /* but not too giant on desktop */
            object-fit: cover;
            border-radius: 50px 50px 30px 30px;
            background: #5f4d31;
            border: 5px solid #f7da9a;
            box-shadow: 0 12px 0 #785f33;
            display: block;
        }

        .mouth-caption {
            background: #253151;
            color: #ffe19c;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 8px 28px;
            border-radius: 60px;
            margin-top: -8px;
            border: 2px solid #eac073;
            box-shadow: 0 8px 0 #1e2843;
            letter-spacing: 0.5px;
        }

        /* ----- SMALL GHINGA PHOTO (smaller than before) ----- */
        .ghinga-section {
            background: #2c3a5c;
            border-radius: 60px;
            padding: 16px 12px 14px;
            border: 3px dashed #c3d2ff;
            box-shadow: inset 0 -6px 0 #1f2b48, 0 10px 0 #212e4a;
            margin: 14px 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .drag-text {
            background: #202d4b;
            color: #dde6ff;
            font-size: 1rem;
            font-weight: 600;
            padding: 6px 22px;
            border-radius: 50px;
            border: 1px solid #9eb3e6;
            margin-bottom: 14px;
        }

        /* smaller ghinga */
        .ghinga-img {
            width: 95px;           /* smaller than before */
            height: 95px;
            object-fit: cover;
            border-radius: 50px;
            background: #896f42;
            border: 6px solid #ffd98c;
            box-shadow: 0 14px 0 #8b6d3b, inset 0 -4px 0 #5e4a29;
            cursor: grab;
            transition: 0.1s;
            display: block;
            margin: 0 auto 10px;
            -webkit-user-drag: element;
        }

        .ghinga-img.dragging {
            opacity: 0.5;
            transform: scale(0.92);
            box-shadow: 0 6px 0 #8b6d3b;
        }

        .hint {
            background: #1b2643;
            color: #fed98f;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            border: 1px solid #f8c56c;
            text-align: center;
            width: 100%;
        }

        /* win message panel */
        .win-container {
            background: #fed26e;
            border-radius: 50px;
            padding: 14px 12px;
            border: 5px solid #ffffff;
            box-shadow: 0 14px 0 #ac801f, 0 16px 20px #00000080;
            margin: 18px 0 14px;
        }

        .win-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .win-main span:first-child {
            font-size: 2rem;
            font-weight: 800;
            color: #261e06;
        }

        .views-instant {
            background: #2f2a0e;
            color: #ffea9c;
            padding: 5px 18px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .tiktok-message {
            background: #423d1e;
            border-radius: 40px;
            padding: 14px 12px;
            margin-top: 10px;
            border: 2px solid #ffe084;
            text-align: center;
        }

        .tiktok-message p {
            color: #ffdfa0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .tiktok-message p span {
            color: #ffd966;
            font-size: 1.6rem;
            font-weight: 800;
            display: block;
            margin-top: 4px;
        }

        /* reset button */
        .reset-btn {
            background: #3e5a96;
            border: none;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 14px 20px;
            border-radius: 70px;
            border-bottom: 8px solid #1e2b4a;
            box-shadow: 0 16px 0 #14203b;
            width: 100%;
            cursor: pointer;
            transition: 0.08s linear;
            margin-top: 14px;
            letter-spacing: 1px;
        }

        .reset-btn:active {
            transform: translateY(8px);
            border-bottom-width: 2px;
            box-shadow: 0 6px 0 #14203b;
        }

        .hidden {
            display: none !important;
        }

        .footer-note {
            text-align: center;
            color: #738bc2;
            font-size: 0.9rem;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="game-card">
        <!-- header with views -->
        <div class="viral-header">
            <div class="tag-badge">🎬 @Bishalshrestha17</div>
            <div class="views-panel" id="viewsPanel">
                <span class="fire">🔥</span>
                <span class="view-counter" id="viewCountDisplay">0</span>
                <span class="view-label">VIEWS</span>
            </div>
        </div>

        <div class="play-stage">
            <!-- BIG mahesh photo (half screen approx) -->
            <div class="mahesh-zone" id="maheshZone">
                <div class="mahesh-frame" id="maheshFrame">
                    <!-- *** USE YOUR mahesh.png *** -->
                    <img src="mahesh.png" 
                         alt="Mahesh big - half screen" 
                         class="mahesh-img" 
                         id="maheshImg"
                         draggable="false"
                         onerror="this.src='https://placehold.co/500x600/5b4a31/ffd48a?text=MAHESH+BIG'">
                </div>
                <div class="mouth-caption">👄 DROP NEAR MOUTH</div>
            </div>

            <!-- SMALL ghinga photo area (smaller) -->
            <div class="ghinga-section" id="ghingaSection">
                <div class="drag-text">👇 drag this ghinga 👇</div>
                <!-- *** USE YOUR ghinga.png *** -->
                <img src="ghinga.png" 
                     alt="small ghinga" 
                     class="ghinga-img" 
                     id="ghingaImg"
                     draggable="true"
                     onerror="this.src='https://placehold.co/300x300/b58b4a/3f301b?text=GHINGA'">
                <div class="hint" id="hintMessage">
                    ⭐ drag to Mahesh → win +2k views
                </div>
            </div>

            <!-- win message + tag (hidden initially) -->
            <div id="winFullMessage" class="hidden">
                <div class="win-container">
                    <div class="win-main">
                        <span>🏆 YOU WIN!</span>
                        <span class="views-instant">🔥 +2000 VIEWS</span>
                    </div>
                    <div class="tiktok-message">
                        <p>
                            📱 if you make video about this game<br>and tag <strong>@Bishalshrestha17</strong><br>
                            <span>⚡ instantly 2k views ⚡</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- play again -->
            <button class="reset-btn" id="resetGameBtn">🔄 PLAY AGAIN</button>
        </div>

        <div class="footer-note">
            ✨ drop small ghinga into big mahesh mouth → tiktok fame ✨
        </div>
    </div>

    <script>
        (function() {
            const ghinga = document.getElementById('ghingaImg');
            const maheshZone = document.getElementById('maheshZone');
            const maheshFrame = document.getElementById('maheshFrame');
            const hint = document.getElementById('hintMessage');
            const winFullDiv = document.getElementById('winFullMessage');
            const resetBtn = document.getElementById('resetGameBtn');
            const viewSpan = document.getElementById('viewCountDisplay');
            const viewsPanel = document.getElementById('viewsPanel');

            let viewCount = 0;
            let gameWon = false;

            function updateViewCounter() {
                viewSpan.innerText = viewCount;
            }

            function pulseViews() {
                viewsPanel.style.transform = 'scale(1.1)';
                viewsPanel.style.transition = 'transform 0.12s';
                setTimeout(() => viewsPanel.style.transform = 'scale(1)', 120);
            }

            // WIN function: +2000 views, hide ghinga, show message
            function winGame() {
                if (gameWon) return;

                gameWon = true;
                viewCount += 2000;
                updateViewCounter();
                pulseViews();

                ghinga.style.display = 'none';
                ghinga.draggable = false;

                winFullDiv.classList.remove('hidden');
                hint.innerText = '🎉 GHINGA DELIVERED! +2000 views!';

                maheshFrame.style.filter = 'drop-shadow(0 0 18px #ffdb7c)';
                maheshFrame.style.transform = 'scale(1.02)';
                setTimeout(() => maheshFrame.style.transform = 'scale(1)', 150);
            }

            function resetGame() {
                gameWon = false;
                ghinga.style.display = 'block';
                ghinga.draggable = true;
                winFullDiv.classList.add('hidden');
                hint.innerText = '⭐ drag to Mahesh → win +2k views';
                maheshFrame.style.filter = 'none';
                maheshFrame.style.transform = 'scale(1)';
                viewCount = 0;
                updateViewCounter();
                ghinga.classList.remove('dragging');
            }

            // drag events
            ghinga.addEventListener('dragstart', function(e) {
                if (gameWon) {
                    e.preventDefault();
                    return false;
                }
                e.dataTransfer.setData('text/plain', 'ghinga');
                e.dataTransfer.effectAllowed = 'move';
                this.classList.add('dragging');
            });

            ghinga.addEventListener('dragend', function(e) {
                this.classList.remove('dragging');
            });

            maheshZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                maheshFrame.style.border = '6px solid #ffdb8e';
            });

            maheshZone.addEventListener('dragleave', function(e) {
                maheshFrame.style.border = '6px solid #c6a35c';
            });

            maheshZone.addEventListener('drop', function(e) {
                e.preventDefault();
                maheshFrame.style.border = '6px solid #c6a35c';

                const data = e.dataTransfer.getData('text/plain');
                if (data === 'ghinga' && !gameWon) {
                    winGame();
                } else if (gameWon) {
                    hint.innerText = '😋 already eaten! press play again';
                }
            });

            resetBtn.addEventListener('click', resetGame);

            document.getElementById('maheshImg').addEventListener('dragstart', (e) => e.preventDefault());

            window.addEventListener('dragend', function() {
                maheshFrame.style.border = '6px solid #c6a35c';
            });

            updateViewCounter();
            console.log('Big mahesh half screen, ghinga smaller. Use your mahesh.png / ghinga.png');
        })();
    </script>
</body>
</html>
